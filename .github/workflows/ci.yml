name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify Windows update artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            throw "dist/latest.yml was not generated"
          }
          if ((Get-ChildItem "dist" -Filter "*.blockmap").Count -lt 1) {
            throw "Updater blockmap was not generated"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-dev-hub-windows
          path: dist/*
          if-no-files-found: error
