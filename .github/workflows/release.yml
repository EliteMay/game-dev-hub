name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $existing = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if ($existing -eq $tag) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already released. Skipping."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        if: steps.release.outputs.exists != 'true'
        run: npm install --no-audit --no-fund

      - name: Test
        if: steps.release.outputs.exists != 'true'
        run: npm test

      - name: Build Windows update artifacts
        if: steps.release.outputs.exists != 'true'
        run: npm run build:win

      - name: Verify update artifacts
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            throw "dist/latest.yml was not generated"
          }
          $setup = Get-ChildItem "dist" -Filter "game_dev_hub_*_setup.exe"
          if ($setup.Count -ne 1) {
            throw "Expected exactly one Setup.exe"
          }
          $blockmap = Get-ChildItem "dist" -Filter "*.blockmap"
          if ($blockmap.Count -lt 1) {
            throw "Expected at least one blockmap"
          }
          if ($setup[0].Length -lt 1MB) {
            throw "Setup.exe is unexpectedly small"
          }

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Game Dev Hub ${{ steps.release.outputs.tag }}" `
            --generate-notes `
            dist/latest.yml `
            dist/*.exe `
            dist/*.blockmap
